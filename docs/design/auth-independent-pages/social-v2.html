    const tagData=[['games',[['valorant','Valorant','Valorant'],['pubg','PUBG Mobile','PUBG Mobile'],['fc','EA SPORTS FC','EA SPORTS FC'],['ml','Mobile Legends','Mobile Legends']]],['vibes',[['chill','Chill duo','لعب بهدوء'],['ranked','Ranked grind','مباريات تصنيف'],['voice','Voice chat','دردشة صوتية'],['night','Late-night queue','لعب ليلي']]],['life',[['music','Music','موسيقى'],['anime','Anime','أنمي'],['football','Football','كرة القدم'],['coffee','Coffee','قهوة']]]];
    const svg=(name)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${{lock:'<rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',check:'<path d="m5 12 4 4L19 6"/>',plus:'<path d="M12 5v14M5 12h14"/>',face:'<path d="M4 7a8 8 0 0 1 16 0v7a8 8 0 0 1-16 0V7Z"/><path d="M8 10h.1M16 10h.1M8 15c2 2 6 2 8 0"/>',alert:'<path d="m12 3 10 18H2L12 3Z"/><path d="M12 9v5m0 3h.1"/>'}[name]}</svg>`;
    const esc=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    let page='profile',locale='en',size='desktop',state='normal',email='',nickname='',gender='',birthday='',avatar=null,consent=false,passwordMode=false,flow='register',result='account',selectedTags=new Set(),timer,toastTimer,seconds=60;
    const t=key=>text[locale][key];
    function ageLimit(today=new Date()){const year=today.getFullYear()-18;const month=today.getMonth();const day=Math.min(today.getDate(),new Date(year,month+1,0).getDate());return `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`}
    function eligible(value,today=new Date()){if(!/^\d{4}-\d{2}-\d{2}$/.test(value))return false;const [year,month,day]=value.split('-').map(Number);const date=new Date(year,month-1,day);if(date.getFullYear()!==year||date.getMonth()!==month-1||date.getDate()!==day)return false;return value<=ageLimit(today)}
    function notify(message=t('placeholder')){const node=document.getElementById('toast');node.textContent=message;node.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>node.hidden=true,4200)}
    function progress(current){return `<div class="progress" aria-hidden="true">${[1,2,3].map(n=>`<i class="${n<=current?'done':''}"></i>`).join('')}</div><p class="step-label">${t(`step${current}`)}</p>`}
    function heading(title,sub){return `<h1 class="title" tabindex="-1">${t(title)}</h1><p class="subtitle">${t(sub)}</p>`}
    function warning(){const key={network:'network',email:'emailError',age:'ageError',photo:'photoError'}[state];return key?`<div class="alert" role="alert">${svg('alert')}<p>${t(key)}</p></div>`:''}
    function input(label,id,type='text',hint=''){const value={email,nickname,birthday}[id]||'';return `<div class="field"><label for="${id}">${t(label)}</label><input id="${id}" type="${type}" value="${esc(value)}" ${type==='email'?'autocomplete="email" inputmode="email" dir="ltr"':id==='nickname'?'autocomplete="nickname"':type==='date'?`max="${ageLimit()}" autocomplete="bday" dir="ltr"`:''} placeholder="${type==='email'?t('emailPlaceholder'):id==='nickname'?t('nicknamePlaceholder'):''}" aria-describedby="${id}-hint"><p id="${id}-hint" class="helper">${hint?t(hint):''}</p></div>`}
    function cta(label,action,disabled=false){return `<button type="button" class="cta" data-action="${action}" ${disabled||state==='loading'?'disabled':''}>${state==='loading'?`<span class="spin" aria-hidden="true"></span>${t('loading')}`:t(label)+'<span class="arrow" aria-hidden="true">→</span>'}</button>`}
    function password(label,id){return `<div class="field"><label for="${id}">${t(label)}</label><div class="password-wrap"><input id="${id}" type="password" dir="ltr" autocomplete="${page==='login'?'current-password':'new-password'}"><button type="button" data-password="${id}" aria-pressed="false">${t('show')}</button></div></div>`}
    function avatarHtml(){return avatar?.type==='photo'?`<img src="${esc(avatar.value)}" alt="${locale==='ar'?'صورتك المختارة':'Your selected avatar'}">`:svg(avatar?'face':'plus')}
    function isProfileValid(){const length=Array.from(nickname.trim()).length;return !!avatar&&length>=2&&length<=32&&!!gender&&eligible(birthday)&&consent}
    function content(){
      if(page==='register')return `${progress(1)}<div class="small-art"><img src="assets/social-editorial-v2.png" alt="" aria-hidden="true"></div>${heading('emailTitle','emailSub')}${warning()}${input('email','email','email')}${cta('send','send-register')}<p class="secondary-copy center">${t('already')} <button class="text-action" data-go="login">${t('login')}</button></p><p class="privacy-line">${svg('lock')}${t('private')}</p>`;
      if(page==='verify')return `${progress(1)}${heading('verifyTitle','verifySub')}<p class="verified ltr">${esc(email?email.replace(/^(.{2}).*(@.*)$/,'$1•••$2'):'pl•••@example.test')}</p>${warning()}<div class="field code"><label for="code">${t('code')}</label><input type="text" id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000" aria-describedby="code-hint"><p class="helper" id="code-hint">${t('codeHint')}</p></div>${cta('verify','verify')}<p class="center secondary-copy"><button class="text-action" id="resend" data-action="resend" disabled>${locale==='ar'?'إعادة الإرسال':'Resend'} <bdi dir="ltr">00:60</bdi></button> · <button class="text-action" data-action="change-email">${t('change')}</button></p>`;
      if(page==='profile')return `${progress(2)}${heading('profileTitle','profileSub')}${warning()}<div class="avatar-row"><button class="avatar ${avatar?'selected':''}" id="avatar-button" data-action="avatar" aria-label="${t('changePhoto')}" style="${avatar?.type==='system'?`background:${avatar.value}`:''}">${avatarHtml()}</button><div class="avatar-copy"><strong>${t('addPhoto')}</strong><small>${t('photoSub')}</small><button data-action="avatar">${t('changePhoto')}</button></div></div>${input('nickname','nickname')}<div class="field"><span class="field-label" id="gender-label">${t('gender')}</span><div class="gender" role="radiogroup" aria-labelledby="gender-label">${[['F','woman'],['M','man'],['U','undisclosed']].map(([value,label])=>`<label><input type="radio" name="gender" value="${value}" ${gender===value?'checked':''}><span>${t(label)}</span></label>`).join('')}</div></div>${input('birthday','birthday','date','birthdayHint')}<label class="consent"><input id="consent" type="checkbox" ${consent?'checked':''}><span>${t('termsStart')} <a href="#terms" data-info="terms">${t('termsFull')}</a> ${t('termsAnd')} <a href="#privacy" data-info="privacy">${t('privacyFull')}</a>.</span></label>${cta('profileContinue','profile-next',!isProfileValid())}`;
      if(page==='tags')return `${progress(3)}${heading('tagsTitle','tagsSub')}${tagData.map(([category,tags])=>`<section class="tag-section"><h2 class="tag-title">${t(category)}</h2><div class="tags">${tags.map(([id,en,ar])=>`<button class="tag" data-tag="${id}" aria-pressed="${selectedTags.has(id)}">${locale==='ar'?ar:en}</button>`).join('')}</div></section>`).join('')}<div class="tag-counter"><span>${t('tagTip')}</span><strong><span id="tag-count">${selectedTags.size}</span>/5 ${t('tagSelected')}</strong></div>${cta('finish','finish')}<p class="center"><button class="text-action" data-action="skip">${t('skip')}</button></p>`;
      if(page==='login')return `${heading('loginTitle','loginSub')}${warning()}${input('email','email','email')}${passwordMode?password('password','login-password')+`<div class="right"><button class="text-action" data-go="forgot">${t('forgotLink')}</button></div>`:''}${cta(passwordMode?'login':'send','send-login')}<p class="center"><button class="text-action" data-action="toggle-method">${t(passwordMode?'codeLogin':'passwordLogin')}</button></p><p class="secondary-copy center">${t('newHere')} <button class="text-action" data-go="register">${t('join')}</button></p>`;
      if(page==='forgot')return `${heading('forgotTitle','forgotSub')}${warning()}${input('email','email','email')}${cta('resetSend','send-reset')}<p class="center"><button class="text-action" data-go="login">${t('backLogin')}</button></p>`;
      if(page==='reset')return `${heading('resetTitle','resetSub')}${warning()}${password('newPassword','new-password')}${password('confirmPassword','confirm-password')}<p class="helper">${t('passwordHint')}</p>${cta('save','reset')}`;
      if(page==='restricted')return `<div class="result-mark restricted">${svg('lock')}</div>${heading('restrictedTitle','restrictedSub')}<div class="notice">${t('restrictedNote')}</div>${cta('contact','help')}<p class="center"><button class="text-action" data-go="login">${t('signOut')}</button></p>`;
      return `<div class="result-mark">${svg('check')}</div>${heading(result==='reset'?'resetDoneTitle':'doneTitle',result==='reset'?'resetDoneSub':'doneSub')}${cta(result==='reset'?'backLogin':'doneButton',result==='reset'?'back-login':'explore')}`;
    }
    function render(focus=false){clearInterval(timer);const node=document.getElementById('auth');node.dir=locale==='ar'?'rtl':'ltr';node.lang=locale;node.className=`auth-shell ${size==='desktop'?'':size==='narrow'?'mobile narrow':'mobile'}`;node.innerHTML=`<aside class="visual"><img src="assets/social-editorial-v2.png" alt="" aria-hidden="true"><div class="visual-copy"><div class="wordmark">LE3EB<small>club</small></div><h2>${t('hero')}</h2></div><div class="visual-note"><span><i class="dot" aria-hidden="true"></i>${t('heroNote')}</span><small>${t('heroMeta')}</small></div></aside><div class="form-side"><header class="form-top"><button class="back" data-action="back" aria-label="${t('back')}">←</button><div class="wordmark">LE3EB<small>club</small></div><select id="page-language" aria-label="${locale==='ar'?'اللغة':'Language'}"><option value="en" ${locale==='en'?'selected':''}>English</option><option value="ar" ${locale==='ar'?'selected':''}>العربية</option></select></header><div class="form-content ${['done','restricted'].includes(page)?'result':''}">${content()}</div><footer class="form-foot"><button data-info="terms">${t('terms')}</button><button data-info="privacy">${t('privacy')}</button><button data-action="help">${t('help')}</button></footer></div>`;document.querySelectorAll('[data-page]').forEach(button=>{if(button.dataset.page===page)button.setAttribute('aria-current','page');else button.removeAttribute('aria-current')});document.getElementById('avatar-heading').textContent=t('avatarTitle');document.getElementById('avatar-description').textContent=t('avatarDescription');document.getElementById('upload-trigger').textContent=t('upload');document.getElementById('avatar-choices').innerHTML=['#f4cab9','#d9d0ef','#cddac1','#e9d298'].map((color,index)=>`<button data-avatar="${color}" aria-label="${locale==='ar'?'صورة رمزية':'System avatar'} ${index+1}">${svg('face')}</button>`).join('');if(focus)node.querySelector('h1')?.focus({preventScroll:true});if(page==='verify')startTimer()}
    function navigate(next){page=next;state='normal';clearTimeout(toastTimer);document.getElementById('toast').hidden=true;document.getElementById('review-state').value=state;render(true)}
    function startTimer(){seconds=60;timer=setInterval(()=>{seconds--;const button=document.getElementById('resend');if(!button){clearInterval(timer);return}button.innerHTML=seconds>0?`${locale==='ar'?'إعادة الإرسال':'Resend'} <bdi dir="ltr">00:${String(seconds).padStart(2,'0')}</bdi>`:t('resend');button.disabled=seconds>0;if(seconds<=0)clearInterval(timer)},1000)}
    function updateProfile(){const button=document.querySelector('[data-action="profile-next"]');if(button)button.disabled=state==='loading'||!isProfileValid()}
    function emailValid(){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)}
    document.addEventListener('input',event=>{const node=event.target;if(node.id==='email')email=node.value;if(node.id==='nickname'){nickname=node.value;updateProfile()}if(node.id==='birthday'){birthday=node.value;const hint=document.getElementById('birthday-hint');const invalid=!!birthday&&!eligible(birthday);hint.textContent=t(invalid?'ageError':'birthdayHint');hint.className=`helper ${invalid?'error':''}`;node.setAttribute('aria-invalid',invalid);updateProfile()}if(node.id==='code')node.value=node.value.replace(/[^0-9]/g,'').slice(0,6)});
    document.addEventListener('change',event=>{const node=event.target;if(['review-language','page-language'].includes(node.id)){locale=node.value;document.getElementById('review-language').value=locale;render()}if(node.id==='review-state'){state=node.value;render()}if(node.name==='gender'){gender=node.value;updateProfile()}if(node.id==='consent'){consent=node.checked;updateProfile()}if(node.id==='avatar-file'){const file=node.files?.[0];if(!file)return;if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>10*1024*1024){notify(t('photoSize'));node.value='';return}const reader=new FileReader();reader.onload=()=>{avatar={type:'photo',value:reader.result};document.getElementById('avatar-dialog').close();render()};reader.onerror=()=>notify(t('photoError'));reader.readAsDataURL(file)}});
    document.addEventListener('click',event=>{const node=event.target.closest('button,a');if(!node)return;if(node.dataset.info){event.preventDefault();notify(locale==='ar'?'هذا رابط توضيحي فقط. لم يتم قبول أي اتفاقية.':'协议入口为设计占位，不会签署任何真实协议。');return}if(node.dataset.page){if(node.dataset.page==='verify')flow='register';navigate(node.dataset.page);return}if(node.dataset.go){navigate(node.dataset.go);return}if(node.dataset.size){size=node.dataset.size;document.querySelectorAll('[data-size]').forEach(button=>button.setAttribute('aria-pressed',button.dataset.size===size));render();return}if(node.hasAttribute('data-demo')){email='player@example.test';nickname=locale==='ar'?'رفيق اللعب':'Noura';gender='U';birthday=ageLimit();avatar={type:'system',value:'#d9d0ef'};consent=false;render();notify('仅填充虚构示例；协议仍需手动勾选，不创建账号。');return}if(node.dataset.avatar){avatar={type:'system',value:node.dataset.avatar};document.getElementById('avatar-dialog').close();render();return}if(node.hasAttribute('data-close')){document.getElementById('avatar-dialog').close();return}if(node.id==='upload-trigger'){document.getElementById('avatar-file').click();return}if(node.dataset.password){const input=document.getElementById(node.dataset.password);const visible=input.type==='password';input.type=visible?'text':'password';node.textContent=t(visible?'hide':'show');node.setAttribute('aria-pressed',visible);return}if(node.dataset.tag){const id=node.dataset.tag;if(selectedTags.has(id))selectedTags.delete(id);else if(selectedTags.size<5)selectedTags.add(id);else{notify(t('maxTags'));return}node.setAttribute('aria-pressed',selectedTags.has(id));document.getElementById('tag-count').textContent=selectedTags.size;return}const action=node.dataset.action;if(!action)return;if(action==='avatar'){document.getElementById('avatar-dialog').showModal();return}if(action.startsWith('send-')){if(!emailValid()){document.getElementById('email').setAttribute('aria-invalid','true');document.getElementById('email-hint').textContent=t('invalidEmail');document.getElementById('email-hint').className='helper error';document.getElementById('email').focus();return}if(action==='send-login'&&passwordMode){result='account';navigate('done');return}flow=action==='send-reset'?'reset':action==='send-login'?'login':'register';navigate('verify');return}if(action==='verify'){if(document.getElementById('code').value.length!==6){document.getElementById('code-hint').textContent=t('codeError');document.getElementById('code-hint').className='helper error';document.getElementById('code').focus();return}if(flow==='reset')navigate('reset');else if(flow==='login'){result='account';navigate('done')}else navigate('profile');return}if(action==='profile-next'){if(isProfileValid())navigate('tags');return}if(action==='toggle-method'){passwordMode=!passwordMode;render();return}if(action==='reset'){const value=document.getElementById('new-password').value;const confirm=document.getElementById('confirm-password').value;if(Array.from(value).length<15||Array.from(value).length>128||value!==confirm){notify(t('passwordHint'));return}result='reset';navigate('done');return}if(action==='finish'||action==='skip'){result='account';navigate('done');return}if(action==='change-email'){navigate(flow==='reset'?'forgot':flow==='login'?'login':'register');return}if(action==='resend'){notify();render();return}if(action==='back-login'){navigate('login');return}if(action==='back'){navigate(page==='profile'?'verify':page==='tags'?'profile':'register');return}notify()});
    render();
