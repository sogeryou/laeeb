    function body(){const bad=state==='invalid';
      if(screen==='login')return `<h1 class="heading" tabindex="-1">${t('welcome')}</h1><p class="sub">${t('welcomeSub')}</p><div class="method" role="group" aria-label="${language==='ar'?'طريقة الدخول':'Login method'}"><button data-method="code" aria-pressed="${method==='code'}">${t('emailCode')}</button><button data-method="password" aria-pressed="${method==='password'}">${t('password')}</button></div>${banner()}${field(t('email'),'email','email','you@example.com',t('emailHint'),bad&&method==='code'?t('invalidEmail'):'')}${method==='password'?passwordField(t('password'),'password')+`<div class="right"><button class="inline-link" data-go="forgot">${t('forgot')}</button></div>`:''}${primary(t(method==='password'?'login':'sendLogin'),'login')}${under('login')}<div class="safe">${icon('shield')}${t('safe')}</div>`;

    function render(focus=false){clearInterval(resendTimer);document.getElementById('screens').innerHTML=pages.map(([id,number,label])=>`<button class="screen-button" data-go="${id}" ${id===screen?'aria-current="page"':''}><small>${number}</small>${label}</button>`).join('');const preview=document.getElementById('preview');preview.className=`preview ${size==='narrow'?'mobile narrow':size}`;preview.dir=language==='ar'?'rtl':'ltr';preview.lang=language;preview.innerHTML=`<div class="auth-layout"><aside class="hero"><div class="brand ltr">LE3EB <span>CLUB</span></div><div><h2>${t('heroTitle')}</h2><p>${t('heroSub')}</p><div class="hero-art" aria-hidden="true"><div class="orbit"></div><div class="orbit two"></div><div class="tile one">${icon('game')}</div><div class="tile two">${icon('chat')}</div><div class="tile three">${icon('users')}</div></div></div><div class="hero-foot">${t('heroFoot')}</div></aside><div class="auth-main"><div class="auth-top"><button class="plain" data-action="back"><span class="arrow" aria-hidden="true">←</span>${screen==='onboarding'?t('back'):t('back')}</button>${screen==='onboarding'?`<button class="plain" data-action="skip">${t('skip')}</button>`:`<select id="page-language" aria-label="${t('lang')}"><option value="en" ${language==='en'?'selected':''}>English</option><option value="ar" ${language==='ar'?'selected':''}>العربية</option></select>`}</div><div class="content"><div class="brand ltr">LE3EB <span>CLUB</span></div>${body()}</div><footer class="auth-foot"><button data-info="terms">${t('terms')}</button><button data-info="privacy">${t('privacy')}</button><button data-action="help">${t('help')}</button></footer></div></div>`;const page=pages.find(p=>p[0]===screen);document.getElementById('notes').innerHTML=`<span class="caption">SCREEN ${page[1]} / AUTHENTICATION</span><h2>${page[2]}</h2><p>与现有用户端一致的深紫背景、紫色按钮与圆角输入。</p><hr><span class="number">交互重点</span><p>${({login:'验证码优先，密码可切换。登录后恢复原页面，不自动下单或发送消息。',register:'先验证邮箱，不直接创建正式账号。昵称与必要确认留到下     function startResend(){resendRemaining=60;resendTimer=setInterval(()=>{resendRemaining--;const node=document.getElementById('resend');if(!node){clearInterval(resendTimer);return}node.textContent=resendRemaining>0?(language==='ar'?`إعادة الإرسال خلال 00:${String(resendRemaining).padStart(2,'0')}`:`Resend in 00:${String(resendRemaining).padStart(2,'0')}`):t('resend');node.disabled=resendRemaining>0;if(resendRemaining<=0)clearInterval(resendTimer)},1000)}

    document.addEventListener('input',event=>{if(event.target.id==='email')email=event.target.value;if(event.target.id==='nickname'){nickname=event.target.value;updateConsent()}if(event.target.id==='code')event.target.value=event.target.value.replace(/[^0-9]/g,'').slice(0,6)});
    document.addEventListener('change',event=>{if(['language','page-language'].includes(event.target.id)){language=event.target.value;document.getElementById('language').value=language;render()}if(event.target.id==='state'){state=event.target.value;render()}if(['age','terms'].includes(event.target.id))updateConsent()});
    document.addEventListener('click',event=>{const target=event.target.closest('button,a');if(!target)return;if(target.dataset.info){event.preventDefault();toast('协议与隐私为设计占位入口，研发前接入正式版本；这里不签署任何协议。');return}if(target.dataset.go){if(target.dataset.go==='verify')origin='register';if(target.dataset.go==='success')result='account';go(target.dataset.go);return}if(target.dataset.size){size=target.dataset.size;document.querySelectorAll('[data-size]').forEach(node=>node.setAttribute('aria-pressed',node.dataset.size===size));render();return}if(target.dataset.method){method=target.dataset.method;state='default';document.getElementById('state').value=state;render();return}if(target.dataset.toggle){const input=document.getElementById(target.dataset.toggle);const reveal=input.type==='password';input.type=reveal?'text':'password';target.textContent=t(reveal?'hide':'show');target.setAttribute('aria-pressed',reveal);return}if(target.dataset.game){const game=target.dataset.game;if(games.has(game))games.delete(game);else if(games.size<5)games.add(game);else{toast('最多选择 5 个游戏。');return}target.setAttribute('aria-pressed',games.has(game));target.querySelector('.tick').textContent=games.has(game)?'✓':'+';document.getElementById('count').textContent=games.size;return}const action=target.dataset.action;if(!action)return;if(['login','register','forgot'].includes(action)){if(!email.includes('@')||!email.split('@')[1]?.includes('.')){state='invalid';document.getElementById('state').value=state;render();document.getElementById('email')?.focus();return}if(action==='login'&&method==='password'){result='account';go('success');return}origin=action;go('verify');return}if(action==='verify'){if(document.getElementById('code').value.length!==6){state='invalid';document.getElementById('state').value=state;render();document.getElementById('code').focus();return}if(origin==='forgot')go('reset');else if(origin==='login'){result='account';go('success')}else go('profile');return}if(action==='create'){result='account';go('onboarding');return}if(action==='legacy'){result='account';go('success');return}if(['onboarding','skip'].includes(action)){result='account';go('success');return}if(action==='reset'){result='reset';go('success');return}if(['back-login','sign-out'].includes(action)){go('login');return}if(action==='change-email'){go(origin==='forgot'?'forgot':origin==='login'?'login':'register');return}if(action==='resend'){toast('重发交互演示：没有真实发送邮件。');render();return}if(action==='back'&&screen==='verify'){go(origin==='forgot'?'forgot':origin==='login'?'login':'register');return}if(action==='back'&&screen==='profile'){origin='register';go('verify');return}toast(action==='finish'?'真实流程将回原目标或首页；设计稿不操作现有应用。':action==='help'?'这里预留客服入口；设计稿不会发送消息。':'这是返回浏览的设计入口；不会改变现有应用。')});
    render();
  </script>
